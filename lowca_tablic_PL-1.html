<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Łowca Tablic PL</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#0b0f17;color:#f7f7f8}
header{position:sticky;top:0;z-index:5;background:#0b0f17ee;backdrop-filter:blur(14px);padding:16px 14px 10px;border-bottom:1px solid #242a35}
h1{font-size:22px;margin:0 0 10px}.stats{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.bar{height:12px;background:#252b36;border-radius:99px;overflow:hidden;margin:9px 0}.fill{height:100%;background:#e5e7eb;width:0;transition:.2s}
.controls{display:grid;grid-template-columns:1fr auto;gap:8px}
input,select,button{font:inherit;border:1px solid #303846;background:#141a24;color:#fff;border-radius:12px;padding:11px}
main{padding:12px 12px 90px;max-width:760px;margin:auto}
.group{margin:18px 0}.group h2{font-size:17px;margin:0 0 8px;color:#d6dae2}
.row{display:flex;align-items:center;gap:12px;background:#131923;border:1px solid #242b37;padding:12px;margin:7px 0;border-radius:14px}
.row.done{opacity:.55}.row.done .code{text-decoration:line-through}
.check{width:25px;height:25px;accent-color:#fff;flex:0 0 auto}.code{font-weight:900;font-size:19px;min-width:58px;letter-spacing:.5px}
.meta{font-size:13px;color:#aab2c0}.empty{text-align:center;color:#aab2c0;padding:40px 10px}
footer{position:fixed;bottom:0;left:0;right:0;background:#0b0f17ee;backdrop-filter:blur(12px);border-top:1px solid #242a35;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
footer button{padding:9px 12px}.small{font-size:12px;color:#8f98a8;margin-top:7px}
</style></head>

<header>
<h1>🇵🇱 Łowca Tablic PL</h1>
<div class="stats"><span id="count">0 / 0</span><span id="pct">0%</span></div>

<div class="controls">
<input id="q" placeholder="Szukaj: WPR, Kraków, śląskie…" autocomplete="off">
<select id="filter"><option value="all">Wszystkie</option><option value="todo">Nieznalezione</option><option value="done">Znalezione</option></select>
</div>
<div class="small">Każdy oficjalny prefiks liczy się osobno. Postęp zapisuje się automatycznie na tym urządzeniu.</div>
</header>
<main id="app"></main>
<footer>
<button id="export">Eksport postępu</button><button id="import">Import</button><button id="reset">Reset</button>
<input type="file" id="file" accept=".json" hidden>
</footer>

const KEY="lowca-tablic-pl-v1";
let done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
const app=document.getElementById("app"),q=document.getElementById("q"),filter=document.getElementById("filter");
function save(){localStorage.setItem(KEY,JSON.stringify([...done])); stats()}
function stats(){const n=DATA.filter(x=>done.has(x.code)).length,p=DATA.length,pc=p?100*n/p:0;
 document.getElementById("count").textContent=`${n} / ${p}`;
 document.getElementById("pct").textContent=`${pc.toFixed(1).replace(".",",")}%`;
 document.getElementById("fill").style.width=pc+"%"}
function render(){
 const term=q.value.trim().toLocaleLowerCase("pl");
 const mode=filter.value;
 const rows=DATA.filter(x=>{
   const hit=!term||(`${x.code} ${x.place} ${x.woj}`).toLocaleLowerCase("pl").includes(term);
   const d=done.has(x.code); return hit&&(mode==="all"||(mode==="done"&&d)||(mode==="todo"&&!d));
 });
 app.innerHTML="";
 if(!rows.length){app.innerHTML='<div class="empty">Brak wyników.</div>';return}
 const groups={}; rows.forEach(x=>(groups[x.woj]??=[]).push(x));
 Object.entries(groups).forEach(([woj,list])=>{
  const sec=document.createElement("section");sec.className="group";
  const found=list.filter(x=>done.has(x.code)).length;
  sec.innerHTML=`<h2>${woj} · ${found}/${list.length}</h2>`;
  list.forEach(x=>{
   const label=document.createElement("label");label.className="row"+(done.has(x.code)?" done":"");
   label.innerHTML=`<input class="check" type="checkbox" ${done.has(x.code)?"checked":""}><div class="code">${x.code}</div><div><div>${x.place}</div><div class="meta">${x.woj}</div></div>`;
   label.querySelector("input").addEventListener("change",e=>{e.target.checked?done.add(x.code):done.delete(x.code);save();render()});
   sec.appendChild(label);
  }); app.appendChild(sec);
 });
 stats()
}
q.addEventListener("input",render);filter.addEventListener("change",render);
document.getElementById("reset").onclick=()=>{if(confirm("Wyzerować cały postęp?")){done.clear();save();render()}};
document.getElementById("export").onclick=()=>{
 const blob=new Blob([JSON.stringify({app:"Łowca Tablic PL",saved:[...done]},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lowca-tablic-postep.json";a.click();URL.revokeObjectURL(a.href)
};
document.getElementById("import").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());done=new Set(o.saved||[]);save();render()}catch{alert("Nie udało się wczytać pliku.")}};
render();
