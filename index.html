<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Łowca Tablic PL</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f5f7;color:#111827}button,input,select{font:inherit}.hidden{display:none!important}#auth{min-height:100vh;background:#111827;display:flex;align-items:center;justify-content:center;padding:24px}.authbox{width:min(440px,100%);background:white;border-radius:24px;padding:26px}.authbox input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:14px;margin:6px 0}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:#111827;color:white;font-weight:700;margin-top:8px}.linkbtn{width:100%;padding:12px;border:0;background:none}.muted{color:#6b7280}.err{color:#b91c1c;min-height:22px}header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:16px 18px 13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:25px}.logout{border:0;background:#374151;color:white;border-radius:10px;padding:7px}.stat{display:flex;justify-content:space-between;font-size:19px;font-weight:700;margin-top:12px}.bar{height:11px;background:#374151;border-radius:99px;margin-top:9px;overflow:hidden}.fill{height:100%;background:white}.saved{text-align:center;font-size:12px;color:#a7f3d0;margin-top:6px}.nav{display:flex;background:white;border-bottom:1px solid #ddd}.nav button{flex:1;border:0;background:white;padding:13px;font-weight:700}.nav .on{border-bottom:3px solid #111827}.controls{padding:14px 16px 8px}.controls input,.controls select{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:16px;background:white;margin-bottom:9px}.tabs{display:flex;gap:7px}.tabs button{flex:1;border:0;border-radius:22px;padding:11px}.tabs .on{background:#111827;color:white}main{padding:8px 14px 100px}.card,.rank{background:white;border-radius:20px;margin:10px 0 16px;overflow:hidden}.card h2{margin:0;padding:18px 20px 4px;font-size:21px}.sub{padding:0 20px 14px;color:#6b7280}.row{display:grid;grid-template-columns:105px 1fr 46px;align-items:center;min-height:62px;padding:0 14px;border-top:1px solid #e5e7eb}.code{font-weight:800;font-size:19px}.row input{width:27px;height:27px}.rankrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:16px;border-bottom:1px solid #eee}.pos,.score,.nick{font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:9px 12px;display:flex;gap:7px}.bottom button{flex:1;padding:10px;border:0;border-radius:12px}</style></head><body>
<section id="auth"><div class="authbox"><h1>🇵🇱 Łowca Tablic PL</h1><p class="muted" id="lead">Zaloguj się, aby zobaczyć kolekcję.</p><div id="nickWrap" class="hidden"><input id="nick" placeholder="Nick do rankingu" maxlength="24"></div><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Hasło (min. 6 znaków)"><button id="authGo" class="primary">Zaloguj się</button><button id="switch" class="linkbtn">Nie masz konta? Załóż konto</button><div id="err" class="err"></div></div></section>
<div id="shell" class="hidden"><header><div class="top"><h1>🇵🇱 Łowca Tablic PL</h1><div><span id="who"></span> <button id="logout" class="logout">Wyloguj</button></div></div><div class="stat"><span id="count"></span><span id="pct"></span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="saved" class="saved">☁ synchronizacja</div></header><div class="nav"><button id="navList" class="on">Tablice</button><button id="navRank">🏆 Ranking</button></div><section id="listView"><div class="controls"><input id="q" placeholder="Szukaj: WPR, Warszawa…"><select id="woj"></select><div class="tabs"><button id="a" class="on">Wszystkie</button><button id="t">Do znalezienia</button><button id="d">Znalezione</button></div></div><main id="app"></main><div class="bottom"><button id="backup">Kopia</button><button id="restore">Przywróć</button><input id="file" type="file" accept=".json" hidden></div></section><section id="rankView" class="hidden"><main><div id="ranking" class="rank"></div></main></section></div><script src="data.js"></script><script type="module" src="app.js"></script></body></html>
