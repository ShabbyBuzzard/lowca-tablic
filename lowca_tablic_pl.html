<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Łowca Tablic PL</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;z-index:5;background:#111827;color:white;padding:18px 16px 14px;box-shadow:0 2px 12px #0003}
h1{font-size:22px;margin:0 0 10px} .stats{display:flex;justify-content:space-between;font-weight:700}
.bar{height:10px;background:#374151;border-radius:99px;overflow:hidden;margin-top:9px}#bar{height:100%;width:0;background:#22c55e;transition:.2s}
.controls{padding:12px;position:sticky;top:112px;z-index:4;background:#f3f4f6}
input,select,button{font:inherit} input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:white;margin-bottom:8px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px} .tabs button{border:0;border-radius:99px;padding:8px 12px;white-space:nowrap;background:#e5e7eb}
.tabs button.on{background:#111827;color:white} main{padding:0 12px 80px;max-width:760px;margin:auto}
.woj{background:white;border-radius:16px;margin:10px 0;overflow:hidden;box-shadow:0 1px 5px #0001} .woj h2{font-size:17px;margin:0;padding:14px 14px 8px}
.mini{padding:0 14px 12px;color:#6b7280;font-size:13px} .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid #eee;cursor:pointer}
.item.done{background:#f0fdf4} .plate{font-weight:900;font-size:18px;min-width:70px;letter-spacing:1px} .place{font-size:14px;flex:1} .check{width:26px;height:26px;border:2px solid #9ca3af;border-radius:8px;display:grid;place-items:center;font-weight:900}
.done .check{background:#22c55e;border-color:#22c55e;color:white} footer{padding:20px 14px;color:#6b7280;font-size:12px;text-align:center}
.empty{text-align:center;padding:40px;color:#6b7280} .reset{display:block;margin:18px auto;border:0;border-radius:10px;padding:10px 14px;background:#fee2e2;color:#991b1b}
</style></head>
<body><header><h1>🇵🇱 Łowca Tablic PL</h1><div class="stats"><span id="count">0 / 0</span><span id="pct">0%</span></div><div class="bar"><div id="bar"></div></div></header>
<div class="controls"><input id="q" placeholder="Szukaj: WPR, Warszawa, cieszyński…"><select id="voiv"><option value="">Wszystkie województwa</option></select>
<div class="tabs"><button data-f="all" class="on">Wszystkie</button><button data-f="todo">Do znalezienia</button><button data-f="done">Znalezione</button></div></div>
<main id="app"></main><footer>Dane: Załącznik nr 13 do rozporządzenia Ministra Infrastruktury z 8.11.2024 r. (Dz.U. 2024 poz. 1709). Każdy wyróżnik liczony osobno.<button class="reset" id="reset">Wyzeruj postęp</button></footer>

let rows=[];
for(const line of raw.split('\n')){
 const [woj,prefs,rest]=line.split('|'); const ps=prefs.split(',');
 for(const entry of rest.split(';')){ const i=entry.lastIndexOf(':'); const place=entry.slice(0,i), sufs=entry.slice(i+1).split(',');
   for(const p of ps) for(const s of sufs) rows.push({woj,place,code:p+s});
 }
}
rows=[...new Map(rows.map(x=>[x.code+'|'+x.place,x])).values()];
const key='lowca-tablic-pl-v1'; let done=new Set(JSON.parse(localStorage.getItem(key)||'[]')); let filter='all';
const app=document.querySelector('#app'), q=document.querySelector('#q'), voiv=document.querySelector('#voiv');
[...new Set(rows.map(x=>x.woj))].forEach(w=>voiv.add(new Option(w,w)));
function save(){localStorage.setItem(key,JSON.stringify([...done]));}
function updateStats(){let n=done.size,t=rows.length,p=t?100*n/t:0;document.querySelector('#count').textContent=`${n} / ${t}`;document.querySelector('#pct').textContent=p.toFixed(1)+'%';document.querySelector('#bar').style.width=p+'%';}
function render(){
 const term=q.value.trim().toLocaleLowerCase('pl'); const groups={};
 rows.forEach(r=>{const id=r.code+'|'+r.place, is=done.has(id); if(voiv.value&&r.woj!==voiv.value)return;if(filter==='done'&&!is)return;if(filter==='todo'&&is)return;
 if(term&&!(`${r.code} ${r.place} ${r.woj}`.toLocaleLowerCase('pl').includes(term)))return;(groups[r.woj]??=[]).push([r,id,is]);});
 app.innerHTML=''; for(const [w,items] of Object.entries(groups)){const total=rows.filter(r=>r.woj===w).length, got=rows.filter(r=>r.woj===w&&done.has(r.code+'|'+r.place)).length;
 const sec=document.createElement('section');sec.className='woj';sec.innerHTML=`<h2>${w}</h2><div class="mini">${got} / ${total} • ${(100*got/total).toFixed(0)}%</div>`;
 items.sort((a,b)=>a[0].code.localeCompare(b[0].code)).forEach(([r,id,is])=>{const el=document.createElement('div');el.className='item '+(is?'done':'');el.innerHTML=`<div class="plate">${r.code}</div><div class="place">${r.place}</div><div class="check">${is?'✓':''}</div>`;
 el.onclick=()=>{done.has(id)?done.delete(id):done.add(id);save();updateStats();render();};sec.appendChild(el);});app.appendChild(sec);}
 if(!app.children.length)app.innerHTML='<div class="empty">Brak wyników 🔎</div>'; updateStats();
}
q.oninput=render;voiv.onchange=render;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render();});
document.querySelector('#reset').onclick=()=>{if(confirm('Na pewno wyzerować cały postęp?')){done.clear();save();render();}};render();
</script></body></html>
